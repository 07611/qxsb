<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;padding:32px;background:#FBFAF7;font-family:Manrope,'PingFang SC','Microsoft YaHei',sans-serif;color:#1A1A1C">
    <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #E7E4DC;border-radius:10px;padding:36px">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:.16em;color:#6B6B72">MOODWAVE · 心绪声场</div>
      <h1 style="font-size:26px;line-height:1.3;margin:20px 0 12px">欢迎来到心绪声场</h1>
      <p style="font-size:16px;line-height:1.7">你好 {{ nickname }}，账号已经准备好。</p>
      <p style="font-size:16px;line-height:1.7;color:#6B6B72">从一张表情开始，找到此刻适合你的旋律。我们也准备了六种情绪的本地演示照片，让你无需打开摄像头也能体验完整链路。</p>
      <p style="margin:28px 0"><a href="{{ appUrl }}" style="display:inline-block;background:#5B5BD6;color:#fff;text-decoration:none;padding:13px 22px;border-radius:10px;font-size:15px">开始探索</a></p>
      <p style="font-size:13px;line-height:1.7;color:#6B6B72">首次部署请尽快修改演示账号密码。</p>
      <hr style="border:0;border-top:1px solid #E7E4DC;margin:28px 0" />
      <p style="font-size:12px;color:#9A9890">此邮件由 Moodwave 自动发送 · {{ sentAt }}</p>
    </div>
  </body>
</html>
