<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;padding:32px;background:#FBFAF7;font-family:Manrope,'PingFang SC','Microsoft YaHei',sans-serif;color:#1A1A1C">
    <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #E7E4DC;border-radius:10px;padding:36px">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:.16em;color:#6B6B72">MOODWAVE · 反馈工单</div>
      <h1 style="font-size:24px;line-height:1.3;margin:20px 0 12px">工单 {{ ticketNo }} 有新回复</h1>
      <p style="font-size:16px;line-height:1.7;color:#6B6B72">你好 {{ nickname }}，我们对你的反馈作出了回复：</p>
      <blockquote style="margin:22px 0;padding:18px;background:#F6F4EE;border-left:3px solid #5B5BD6;border-radius:4px;font-size:16px;line-height:1.7">{{ reply }}</blockquote>
      <p style="font-size:13px;line-height:1.7;color:#6B6B72">你可以在站内「意见反馈」页面继续补充信息。原始描述不会被修改，所有补充都会单独记录。</p>
      <hr style="border:0;border-top:1px solid #E7E4DC;margin:28px 0" />
      <p style="font-size:12px;color:#9A9890">此邮件由 Moodwave 自动发送 · {{ sentAt }}</p>
    </div>
  </body>
</html>
