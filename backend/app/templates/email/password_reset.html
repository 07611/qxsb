<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;padding:32px;background:#FBFAF7;font-family:Manrope,'PingFang SC','Microsoft YaHei',sans-serif;color:#1A1A1C">
    <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #E7E4DC;border-radius:10px;padding:36px">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:.16em;color:#6B6B72">MOODWAVE · 心绪声场</div>
      <h1 style="font-size:26px;line-height:1.3;margin:20px 0 12px">重置你的密码</h1>
      <p style="font-size:16px;line-height:1.7;color:#6B6B72">你好 {{ nickname }}，我们收到了重置密码的请求。链接 15 分钟内有效，使用一次后立即作废。</p>
      <p style="margin:28px 0"><a href="{{ resetUrl }}" style="display:inline-block;background:#5B5BD6;color:#fff;text-decoration:none;padding:13px 22px;border-radius:10px;font-size:15px">设置新密码</a></p>
      <p style="font-size:13px;line-height:1.7;color:#6B6B72">若按钮无法点击，请复制此地址：<br /><span style="word-break:break-all;color:#5B5BD6">{{ resetUrl }}</span></p>
      <p style="font-size:13px;line-height:1.7;color:#6B6B72">如果不是你发起的请求，可以忽略此邮件；你的密码不会被修改。</p>
      <hr style="border:0;border-top:1px solid #E7E4DC;margin:28px 0" />
      <p style="font-size:12px;color:#9A9890">此邮件由 Moodwave 自动发送 · {{ sentAt }}</p>
    </div>
  </body>
</html>
