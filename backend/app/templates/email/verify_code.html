<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;padding:32px;background:#FBFAF7;font-family:Manrope,'PingFang SC','Microsoft YaHei',sans-serif;color:#1A1A1C">
    <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #E7E4DC;border-radius:10px;padding:36px">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:.16em;color:#6B6B72">MOODWAVE · 心绪声场</div>
      <h1 style="font-size:26px;line-height:1.3;margin:20px 0 12px">你的验证码</h1>
      <p style="font-size:16px;line-height:1.7;color:#6B6B72">你好 {{ nickname }}，请在页面中输入以下 6 位验证码完成验证。验证码 5 分钟内有效，且只能使用一次。</p>
      <div style="margin:28px 0;padding:20px;text-align:center;background:#F6F4EE;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:34px;letter-spacing:.28em;color:#1A1A1C">{{ code }}</div>
      <p style="font-size:13px;line-height:1.7;color:#6B6B72">如果这不是你本人的操作，请忽略此邮件。为了账号安全，请勿向任何人转发验证码。</p>
      <hr style="border:0;border-top:1px solid #E7E4DC;margin:28px 0" />
      <p style="font-size:12px;color:#9A9890">此邮件由 Moodwave 自动发送 · {{ sentAt }}</p>
    </div>
  </body>
</html>
