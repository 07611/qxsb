<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;padding:32px;background:#FBFAF7;font-family:Manrope,'PingFang SC','Microsoft YaHei',sans-serif;color:#1A1A1C">
    <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #E7E4DC;border-radius:10px;padding:36px">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:.16em;color:#6B6B72">MOODWAVE · 心绪声场</div>
      <h1 style="font-size:25px;line-height:1.3;margin:20px 0 14px">{{ title }}</h1>
      <p style="font-size:16px;line-height:1.75;color:#4A4A50">你好 {{ nickname }}，{{ content }}</p>
      <p style="margin:28px 0"><a href="{{ appUrl }}" style="display:inline-block;background:#5B5BD6;color:#fff;text-decoration:none;padding:13px 22px;border-radius:10px;font-size:15px">打开心绪声场</a></p>
      <p style="font-size:12px;line-height:1.7;color:#9A9890">你收到此邮件是因为开启了邮件推送。可在「通知设置」中随时关闭。</p>
    </div>
  </body>
